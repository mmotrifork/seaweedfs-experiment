apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata: 
  name: alice-creds
  namespace: test-app
spec:
  seaweedRef: 
    name: seaweed-sample
    namespace: seaweedfs
  identityRef: 
    name: alice
  secretRef: 
    name: alice-s3-secret
    namespace: test-app   # accessKeyField/secretKeyField default to accessKey/secretKey