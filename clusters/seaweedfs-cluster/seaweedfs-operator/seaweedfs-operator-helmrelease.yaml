apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs-operator
spec:
  interval: 10m
  timeout: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: seaweedfs-operator
      version: 0.1.33
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: seaweedfs-operator
  values:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: seaweedfs-operator
                namespace: seaweedfs-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: seaweedfs-operator 
                        env:
                          - name: ENABLE_CSI_DRIVER
                            value: "true"
            