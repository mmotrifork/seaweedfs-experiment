apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: filer-access
  namespace: seaweedfs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: filer
      app.kubernetes.io/instance: seaweed-sample
      app.kubernetes.io/managed-by: seaweedfs-operator
      app.kubernetes.io/name: seaweedfs
      io.kubernetes.pod.namespace: seaweedfs
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs-operator
            io.kubernetes.pod.namespace: seaweedfs-operator
        - matchLabels:
            app.kubernetes.io/component: controller
            app.kubernetes.io/instance: seaweedfs
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs-csi-driver
            io.kubernetes.pod.namespace: seaweedfs-csi-driver
        - matchLabels:
            app.kubernetes.io/component: s3
            app.kubernetes.io/instance: seaweed-sample
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
        - matchLabels:
            app.kubernetes.io/component: mount
            app.kubernetes.io/instance: seaweedfs
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs-csi-driver
            io.kubernetes.pod.namespace: seaweedfs-csi-driver
        - matchLabels:
            app.kubernetes.io/component: filer
            app.kubernetes.io/instance: seaweed-sample
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
            - port: "18888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: master
            app.kubernetes.io/instance: seaweed-sample
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "9333"
              protocol: TCP
            - port: "19333"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: filer
            app.kubernetes.io/instance: seaweed-sample
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
            - port: "18888"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: volume
            app.kubernetes.io/instance: seaweed-sample
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8444"
              protocol: TCP
            - port: "18444"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: s3
            app.kubernetes.io/instance: seaweed-sample
            app.kubernetes.io/managed-by: seaweedfs-operator
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
            - port: "18333"
              protocol: TCP