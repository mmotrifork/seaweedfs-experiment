apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-access
  namespace: cnpg
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cnpg
      io.kubernetes.pod.namespace: cnpg
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  ingress:
    - fromEntities:
        - remote-node
      toPorts:
      - ports:
        - port: "9443"
          protocol: TCP