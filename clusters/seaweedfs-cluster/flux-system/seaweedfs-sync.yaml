apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: seaweedfs
    namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/seaweedfs-cluster/seaweedfs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: seaweedfs-operator
      namespace: flux-system
