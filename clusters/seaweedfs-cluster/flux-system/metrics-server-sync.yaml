apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: metrics-server
    namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/seaweedfs-cluster/metrics-server
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
  wait: true
