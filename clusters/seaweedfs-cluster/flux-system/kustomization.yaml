apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- bootstrap-sync.yaml
- gotk-components.yaml
- gotk-sync.yaml
- seaweedfs-operator-sync.yaml
- seaweedfs-sync.yaml
- seaweedfs-csi-driver-sync.yaml
- test-app-sync.yaml
- metrics-server-sync.yaml

patches:
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --requeue-dependency=2s
    target:
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system