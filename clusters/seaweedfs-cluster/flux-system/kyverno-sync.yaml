apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: kyverno
    namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/seaweedfs-cluster/kyverno
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: bootstrap
      namespace: flux-system
  wait: true
